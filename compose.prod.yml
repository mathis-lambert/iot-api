services:
  iot:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-next:latest
    container_name: iot
    restart: unless-stopped
    env_file:
      - path: .env.production
        format: raw
    environment:
      HOSTNAME: 0.0.0.0
    networks:
      - proxy
      - databases
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.iot.rule=Host(`iot.mathislambert.fr`)"
      - "traefik.http.routers.iot.entrypoints=websecure"
      - "traefik.http.routers.iot.tls=true"
      - "traefik.http.routers.iot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iot-http.rule=Host(`iot.mathislambert.fr`)"
      - "traefik.http.routers.iot-http.entrypoints=web"
      - "traefik.http.routers.iot-http.service=iot"
      - "traefik.http.routers.iot-http.priority=100"
      - "traefik.http.services.iot.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
  databases:
    external: true
